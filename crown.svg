<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 皇冠主體金色漸層：亮金 → 金 → 深金，營造金屬光澤 -->
    <linearGradient id="goldBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDF6B"/>
      <stop offset="0.55" stop-color="#F5B800"/>
      <stop offset="1" stop-color="#D18F00"/>
    </linearGradient>
    <!-- 金球漸層：左上高光 -->
    <radialGradient id="goldBall" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFF6C0"/>
      <stop offset="0.55" stop-color="#F5B800"/>
      <stop offset="1" stop-color="#C97F00"/>
    </radialGradient>
    <!-- 底部飾帶漸層 -->
    <linearGradient id="goldBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0B400"/>
      <stop offset="0.5" stop-color="#D18F00"/>
      <stop offset="1" stop-color="#A86E00"/>
    </linearGradient>
    <!-- 中央紅寶石：粉紅高光 → 紅 → 深紅 -->
    <radialGradient id="rubyRed" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#FFB3BA"/>
      <stop offset="0.5" stop-color="#E85D5D"/>
      <stop offset="1" stop-color="#A02050"/>
    </radialGradient>
    <!-- 兩側青綠寶石 -->
    <radialGradient id="gemGreen" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#C8F5D0"/>
      <stop offset="0.5" stop-color="#5DC878"/>
      <stop offset="1" stop-color="#2E7D4F"/>
    </radialGradient>
  </defs>

  <!-- ===== 三尖頂金球 ===== -->
  <circle cx="12.5" cy="17.5" r="4" fill="url(#goldBall)" stroke="#A86E00" stroke-width="1"/>
  <circle cx="32" cy="7.5" r="4.5" fill="url(#goldBall)" stroke="#A86E00" stroke-width="1"/>
  <circle cx="51.5" cy="17.5" r="4" fill="url(#goldBall)" stroke="#A86E00" stroke-width="1"/>
  <!-- 金球高光點 -->
  <circle cx="11.2" cy="16.2" r="1.1" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="30.5" cy="6" r="1.2" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="50.2" cy="16.2" r="1.1" fill="#FFFFFF" opacity="0.85"/>

  <!-- ===== 皇冠主體 ===== -->
  <path d="M12 48 L12 24 Q12 22 13.6 23.2 L22 29.6 L30.4 14.6 Q32 12.2 33.6 14.6 L42 29.6 L50.4 23.2 Q52 22 52 24 L52 48 Z"
        fill="url(#goldBody)" stroke="#A86E00" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- 主體左側反光條 -->
  <path d="M17.5 44 L17.5 27.5 L22.5 31 L22.5 44 Z" fill="#FFFFFF" opacity="0.28"/>
  <!-- 主體右側暗部 -->
  <path d="M46.5 44 L46.5 27.5 L41.5 31 L41.5 44 Z" fill="#8A5A00" opacity="0.18"/>

  <!-- ===== 寶石鑲嵌座（金色底座） ===== -->
  <circle cx="32" cy="38" r="7" fill="#B57E00" stroke="#8A5A00" stroke-width="1"/>
  <circle cx="21" cy="39" r="4" fill="#B57E00" stroke="#8A5A00" stroke-width="1"/>
  <circle cx="43" cy="39" r="4" fill="#B57E00" stroke="#8A5A00" stroke-width="1"/>

  <!-- ===== 寶石 ===== -->
  <!-- 中央紅寶石（橢圓） -->
  <ellipse cx="32" cy="38" rx="5" ry="6" fill="url(#rubyRed)"/>
  <ellipse cx="30.4" cy="35.8" rx="1.4" ry="1.8" fill="#FFFFFF" opacity="0.75"/>
  <!-- 左青綠寶石 -->
  <circle cx="21" cy="39" r="2.8" fill="url(#gemGreen)"/>
  <circle cx="20.1" cy="38.1" r="0.8" fill="#FFFFFF" opacity="0.8"/>
  <!-- 右青綠寶石 -->
  <circle cx="43" cy="39" r="2.8" fill="url(#gemGreen)"/>
  <circle cx="42.1" cy="38.1" r="0.8" fill="#FFFFFF" opacity="0.8"/>

  <!-- ===== 底部飾帶 ===== -->
  <rect x="9" y="45.5" width="46" height="10" rx="3" fill="url(#goldBand)" stroke="#8A5A00" stroke-width="1.2"/>
  <!-- 飾帶亮線 -->
  <line x1="13" y1="48.3" x2="51" y2="48.3" stroke="#FFFFFF" stroke-width="1" opacity="0.45" stroke-linecap="round"/>
  <!-- 飾帶鉚釘 -->
  <circle cx="18" cy="51.5" r="1.5" fill="url(#goldBall)" stroke="#8A5A00" stroke-width="0.8"/>
  <circle cx="32" cy="51.5" r="1.5" fill="url(#goldBall)" stroke="#8A5A00" stroke-width="0.8"/>
  <circle cx="46" cy="51.5" r="1.5" fill="url(#goldBall)" stroke="#8A5A00" stroke-width="0.8"/>
</svg>
